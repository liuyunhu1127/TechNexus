        budgetMin: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        budgetMax: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        deadlineAt: {oneOf: [{$ref: '#/components/schemas/Instant'}, {type: 'null'}]}
        visibility: {$ref: '#/components/schemas/Visibility'}
        contact: {type: [string, 'null'], maxLength: 1000, writeOnly: true}
        fileIds: {type: array, maxItems: 20, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
        expectedVersion: {type: integer, minimum: 0}
    DemandResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Demand'}
    DemandPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Demand'}}
        nextCursor: {type: [string, 'null']}
    ProposalWrite:
      type: object
      additionalProperties: false
      required: [plan, techStack, estimatedDays, suggestedQuote]
      properties:
        plan: {type: string, minLength: 1, maxLength: 50000}
        techStack: {type: array, minItems: 1, maxItems: 30, items: {type: string, maxLength: 80}}
