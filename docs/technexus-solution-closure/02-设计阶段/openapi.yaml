        '403': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: tn_refresh
  parameters:
    ManagementPage:
      name: page
      in: query
      schema: {type: integer, minimum: 1, maximum: 10000, default: 1}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 256}
    ConfirmationToken:
      name: X-Confirmation-Token
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 512}
    Cursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 1024}
    PageSize:
      name: pageSize
      in: query
      schema: {type: integer, minimum: 1, maximum: 50, default: 20}
    ContentId:
      name: contentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    DemandId:
      name: demandId
      in: path
      required: true
      schema: {type: string, format: uuid}
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: {type: string, format: uuid}
    FileId:
      name: fileId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    ManagedPostDetail:
      description: Management view of a post
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                allOf:
                  - $ref: '#/components/schemas/ManagedPost'
                  - type: object
                    required: [ownerName, visibility, body, publishedTitle, publishedBody]
                    properties:
                      ownerName: {type: string}
                      visibility: {$ref: '#/components/schemas/Visibility'}
                      body: {type: string}
                      publishedTitle: {type: [string, 'null']}
                      publishedBody: {type: [string, 'null']}
    Problem:
      description: Request rejected
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RateLimited:
      description: Rate limited
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    AccountCreated:
      description: Account created
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ProfileResponse'}
    TokenPair:
      description: Access token returned; rotated refresh token is Secure HttpOnly cookie
      headers:
        Set-Cookie:
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TokenResponse'}
  schemas:
    ManagedUserStatus:
      type: string
      enum: [REGISTERED, ACTIVE, LOCKED, DISABLED, CANCELLED]
    ManagedUser:
      type: object
      required: [id, email, displayName, status, version]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        email: {type: string, format: email}
        displayName: {type: string}
        status: {$ref: '#/components/schemas/ManagedUserStatus'}
        version: {type: integer, format: int64, minimum: 0}
    ManagedPost:
      type: object
      required: [id, ownerId, title, type, state, version]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        ownerId: {$ref: '#/components/schemas/Uuid'}
        title: {type: string}
        type: {type: string, enum: [POST, PROBLEM, SOLUTION]}
        state: {$ref: '#/components/schemas/ContentState'}
        version: {type: integer, format: int64, minimum: 0}
    ManagedStatusChange:
      type: object
      required: [enabled, expectedVersion, reason]
      properties:
        enabled: {type: boolean}
        expectedVersion: {type: integer, format: int64, minimum: 0}
        reason: {type: string, minLength: 1, maxLength: 1000}
    Uuid:
      type: string
      format: uuid
    Instant:
      type: string
      format: date-time
    AccountStatus:
      type: string
      enum: [REGISTERED, ACTIVE, LOCKED, DISABLED, CANCELLED]
    ContentType:
      type: string
      enum: [POST, DOCUMENT, PROBLEM, SOLUTION]
    ContentState:
      type: string
      enum: [DRAFT, PENDING_REVIEW, WAITING_PRICING, PUBLISHED, REJECTED, OFFLINE, DELETED, BLOCKED]
    DemandState:
      type: string
      enum: [DRAFT, PENDING_REVIEW, APPROVED, REJECTED, PUBLISHED, NEGOTIATING, CONFIRMED, IN_PROGRESS, DELIVERED, COMPLETED, EXPIRED, CANCELLED, OFFLINE]
    AuditState:
      type: string
      enum: [CREATED, PENDING, PROCESSING, APPROVED, REJECTED, CANCELLED]
    FileState:
      type: string
      enum: [UPLOADING, UPLOADED, SCANNING, AVAILABLE, BLOCKED, EXPIRED, DELETED]
    Visibility:
      type: string
      enum: [PUBLIC, LOGIN_REQUIRED, PARTICIPANTS, OWNER_ONLY, ADMIN_ONLY]
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: {type: string, pattern: '^\d{1,10}(\.\d{1,2})?$'}
        currency: {type: string, const: CNY}
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 12, maxLength: 128}
        displayName: {type: string, minLength: 1, maxLength: 80}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [account, password]
      properties:
        account: {type: string, minLength: 3, maxLength: 254}
        password: {type: string, minLength: 1, maxLength: 128}
    TokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: {type: string}
        tokenType: {type: string, const: Bearer}
        expiresIn: {type: integer, minimum: 1, example: 900}
    Profile:
      type: object
      additionalProperties: false
      required: [id, status, displayName, version]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        status: {$ref: '#/components/schemas/AccountStatus'}
        displayName: {type: string, maxLength: 80}
        bio: {type: string, maxLength: 1000}
        version: {type: integer, minimum: 0}
    ProfilePatch:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 80}
        bio: {type: string, maxLength: 1000}
        expectedVersion: {type: integer, minimum: 0}
    ProfileResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Profile'}
    Content:
      type: object
      additionalProperties: false
      required: [id, type, state, visibility, title, version, tagIds, fileIds]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        type: {$ref: '#/components/schemas/ContentType'}
        state: {$ref: '#/components/schemas/ContentState'}
        visibility: {$ref: '#/components/schemas/Visibility'}
        title: {type: string, maxLength: 160}
        summary: {type: string, maxLength: 500}
        body: {type: string, maxLength: 200000}
        auditTaskId:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
          description: Present only when a review submission has been accepted.
        tagIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: {$ref: '#/components/schemas/Uuid'}
        fileIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: {$ref: '#/components/schemas/Uuid'}
        sourceDemandId:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
          description: Required only when a SOLUTION closes a demand.
        sourceSolutionId:
          oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]
          description: Required only when a DOCUMENT is distilled from a solution.
        publishedAt: {$ref: '#/components/schemas/Instant'}
        version: {type: integer, minimum: 0}
    ContentWrite:
      type: object
      additionalProperties: false
      required: [type, visibility, title, body]
      properties:
        type: {$ref: '#/components/schemas/ContentType'}
        visibility: {$ref: '#/components/schemas/Visibility'}
        title: {type: string, minLength: 1, maxLength: 160}
        summary: {type: string, maxLength: 500}
        body: {type: string, minLength: 1, maxLength: 200000}
        tagIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: {$ref: '#/components/schemas/Uuid'}
        fileIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: {$ref: '#/components/schemas/Uuid'}
    ContentPatch:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        visibility: {$ref: '#/components/schemas/Visibility'}
        title: {type: string, minLength: 1, maxLength: 160}
        summary: {type: string, maxLength: 500}
        body: {type: string, minLength: 1, maxLength: 200000}
        tagIds:
          type: array
          maxItems: 10
          uniqueItems: true
          items: {$ref: '#/components/schemas/Uuid'}
        fileIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: {$ref: '#/components/schemas/Uuid'}
        expectedVersion: {type: integer, minimum: 0}
    ContentResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Content'}
    ContentPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Content'}}
        nextCursor: {type: [string, 'null']}
    ExpectedVersionCommand:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 0}
    CommentWrite:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: {type: string, minLength: 1, maxLength: 5000}
        parentId: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
