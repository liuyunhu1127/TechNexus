openapi: 3.1.0
info:
  title: technexus-server API
  version: 1.0.9
  x-service-name: technexus-server
  description: >-
    TechNexus V1 user and administration contract. Demand is not an Order and
    this contract does not expose payment, purchase, entitlement, video upload,
    or instant-messaging capabilities.
servers:
  - url: /api/v1
    description: Same-origin reverse-proxy base path
tags:
  - name: Auth
  - name: Profile
  - name: Content
  - name: Demand
  - name: Lineage
  - name: File
  - name: Search
  - name: Notification
  - name: Audit
  - name: Pricing
  - name: Operations
  - name: AI
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerAccount
      x-requirements: [FR-ACC-01]
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201': {$ref: '#/components/responses/AccountCreated'}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      x-requirements: [FR-ACC-01]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/TokenPair'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      x-requirements: [FR-ACC-01, FR-ACC-03]
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200': {$ref: '#/components/responses/TokenPair'}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      x-requirements: [FR-ACC-03]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': {description: Session revoked}
        '401': {$ref: '#/components/responses/Problem'}
  /me:
    get:
      tags: [Profile]
      operationId: getMyProfile
      x-requirements: [FR-ACC-02]
      responses:
        '200':
          description: Current profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileResponse'}
        '401': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Profile]
      operationId: updateMyProfile
      x-requirements: [FR-ACC-02]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfilePatch'}
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /contents:
    get:
      tags: [Content]
      operationId: listContents
      x-requirements: [FR-CNT-01, FR-SCH-02, FR-RCM-01]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - name: type
          in: query
          schema: {$ref: '#/components/schemas/ContentType'}
        - name: sort
          in: query
          schema: {type: string, enum: [relevance, latest, hottest]}
      responses:
        '200':
          description: Visible content page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentPage'}
        '400': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Content]
      operationId: createContent
      x-requirements: [FR-CNT-01, FR-CNT-02, FR-CNT-05]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContentWrite'}
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /contents/{contentId}:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    get:
      tags: [Content]
      operationId: getContent
      x-requirements: [FR-CNT-01, FR-CNT-06]
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Visible published or authorized draft content
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentResponse'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Content]
      operationId: updateContent
      x-requirements: [FR-CNT-01, FR-CNT-06]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContentPatch'}
      responses:
        '200':
          description: Draft/revision updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /contents/{contentId}/submit:
    post:
      tags: [Content]
      operationId: submitContentForReview
      x-requirements: [FR-CNT-06, FR-CNT-07, FR-AUD-01]
      parameters:
        - $ref: '#/components/parameters/ContentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExpectedVersionCommand'}
      responses:
        '202':
          description: Content frozen and review task accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContentResponse'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /contents/{contentId}/comments:
    get:
      tags: [Content]
      operationId: listComments
      x-requirements: [FR-CNT-03]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContentId'
      responses:
        '200':
          description: Two-level comment thread including deleted-parent placeholders
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommentPage'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Content]
      operationId: createComment
      x-requirements: [FR-CNT-03]
      parameters:
        - $ref: '#/components/parameters/ContentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommentWrite'}
      responses:
        '201':
          description: Comment created or queued for review
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommentResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /contents/{contentId}/comments/{commentId}:
    delete:
      tags: [Content]
      operationId: deleteComment
      x-requirements: [FR-CNT-03]
      parameters:
        - $ref: '#/components/parameters/ContentId'
        - name: commentId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Uuid'}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExpectedVersionCommand'}
      responses:
        '200':
          description: Comment body removed while replies remain linked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommentResponse'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /contents/{contentId}/demands:
    post:
      tags: [Lineage, Demand]
      operationId: createDemandFromContent
      x-requirements: [FR-LOOP-01]
      parameters:
        - $ref: '#/components/parameters/ContentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DemandWrite'}
      responses:
        '201':
          description: Demand draft and source lineage created atomically
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DemandResponse'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /demands:
    get:
      tags: [Demand]
      operationId: listDemands
      x-requirements: [FR-DMD-01, FR-DMD-07, FR-SCH-02]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          schema: {type: string, enum: [relevance, latest, budget, deadline]}
      responses:
        '200':
          description: Visibility-filtered demand page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DemandPage'}
        '400': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Demand]
      operationId: createDemand
      x-requirements: [FR-DMD-01, FR-DMD-07]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DemandWrite'}
      responses:
        '201':
          description: Demand draft created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DemandResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /demands/{demandId}:
    parameters:
      - $ref: '#/components/parameters/DemandId'
    get:
      tags: [Demand]
      operationId: getDemand
      x-requirements: [FR-DMD-01, FR-DMD-07]
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Demand filtered to caller visibility
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DemandResponse'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Demand]
      operationId: updateDemand
      x-requirements: [FR-DMD-01, FR-DMD-06]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DemandPatch'}
      responses:
        '200':
          description: Demand draft updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DemandResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /demands/{demandId}/submit:
    post:
      tags: [Demand]
      operationId: submitDemandForReview
      x-requirements: [FR-DMD-02, FR-AUD-01]
      parameters:
        - $ref: '#/components/parameters/DemandId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExpectedVersionCommand'}
      responses:
        '202':
          description: Review accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DemandResponse'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /demands/{demandId}/proposals:
    post:
      tags: [Demand]
      operationId: createProposal
      x-requirements: [FR-DMD-03, FR-DMD-07]
      parameters:
        - $ref: '#/components/parameters/DemandId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProposalWrite'}
      responses:
        '201':
          description: Proposal submitted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProposalResponse'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /demands/{demandId}/transitions:
    post:
      tags: [Demand]
      operationId: transitionDemand
      x-requirements: [FR-DMD-04, FR-DMD-06]
      parameters:
        - $ref: '#/components/parameters/DemandId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DemandTransition'}
      responses:
        '200':
          description: Transition applied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DemandResponse'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /lineages/{targetType}/{targetId}:
    get:
      tags: [Lineage]
      operationId: getLineage
      x-requirements: [FR-LOOP-02, FR-LOOP-04]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: targetType
          in: path
          required: true
          schema: {type: string, enum: [CONTENT, DEMAND, PROPOSAL]}
        - name: targetId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Visibility-filtered lineage graph
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LineageResponse'}
        '404': {$ref: '#/components/responses/Problem'}
  /files/uploads:
    post:
      tags: [File]
      operationId: createFileUpload
      x-requirements: [FR-FILE-01, FR-FILE-02, FR-FILE-03]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FileUploadRequest'}
      responses:
        '201':
          description: Fixed-key direct upload session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileUploadResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /files/uploads/{uploadId}/complete:
    post:
      tags: [File]
      operationId: completeFileUpload
      x-requirements: [FR-FILE-03, FR-FILE-04]
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Object HEAD validated and scan queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileResponse'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /files/{fileId}:
    get:
      tags: [File]
      operationId: getFileStatus
      x-requirements: [FR-FILE-03, FR-FILE-04]
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Owner-visible scan status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileResponse'}
        '404': {$ref: '#/components/responses/Problem'}
  /files/{fileId}/download-url:
    post:
      tags: [File]
      operationId: createFileDownloadUrl
      x-requirements: [FR-FILE-05, FR-FILE-06]
      parameters:
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Five-minute authorized download URL
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DownloadUrlResponse'}
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /tags:
    get:
      tags: [Content]
      operationId: listTags
      x-requirements: [FR-CNT-07]
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Active tags available for content association
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TagListResponse'}
  /search:
    get:
      tags: [Search]
      operationId: search
      x-requirements: [FR-SCH-01, FR-SCH-02, FR-RCM-01]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 2, maxLength: 100}
        - name: type
          in: query
          schema: {type: string, enum: [ALL, CONTENT, DEMAND, USER, TAG]}
        - name: sort
          in: query
          schema: {type: string, enum: [RELEVANCE, LATEST, HOT, FAVORITES, BUDGET, DEADLINE]}
        - name: page
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Public/authorized results
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchPage'}
        '400': {$ref: '#/components/responses/Problem'}
  /recommendations:
    get:
      tags: [Search]
      operationId: listRecommendations
      x-requirements: [FR-RCM-01]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Operator-pinned targets precede organic public discovery results
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecommendationPage'}
  /notifications:
    get:
      tags: [Notification]
      operationId: listNotifications
      x-requirements: [FR-MSG-01]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Current user's notifications
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationPage'}
        '401': {$ref: '#/components/responses/Problem'}
  /notifications/{notificationId}/read:
    post:
      tags: [Notification]
      operationId: readNotification
      x-requirements: [FR-MSG-01]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': {description: Marked read or already read}
        '404': {$ref: '#/components/responses/Problem'}
  /admin/users:
    get:
      tags: [Operations]
      operationId: listManagedUsers
      description: Requires the admin scope. Searches account email and display name.
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 254}}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/ManagedUserStatus'}
        - $ref: '#/components/parameters/ManagementPage'
      responses:
        '200':
          description: Matching user accounts
          content:
            application/json:
              schema:
                type: object
                required: [items, page, hasNext]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ManagedUser'}}
                  page: {type: integer}
                  hasNext: {type: boolean}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/users/{id}/status:
    put:
      tags: [Operations]
      operationId: changeManagedUserStatus
      description: Requires the admin scope. Disabling revokes all sessions. The acting admin account is protected.
      x-requirements: [FR-ACC-02, FR-ACC-03]
      parameters:
        - {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManagedStatusChange'}
      responses:
        '200':
          description: User status and audit record committed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ManagedUser'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/posts:
    get:
      tags: [Operations]
      operationId: listManagedPosts
      description: Requires the admin scope. Searches the latest post title.
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 160}}
        - name: state
          in: query
          schema: {$ref: '#/components/schemas/ContentState'}
        - $ref: '#/components/parameters/ManagementPage'
      responses:
        '200':
          description: Matching posts
          content:
            application/json:
              schema:
                type: object
                required: [items, page, hasNext]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ManagedPost'}}
                  page: {type: integer}
                  hasNext: {type: boolean}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/posts/{id}:
    get:
      tags: [Operations]
      operationId: getManagedPost
      description: Requires the admin scope. Includes the latest and previously published versions.
      parameters:
        - {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
      responses:
        '200': {$ref: '#/components/responses/ManagedPostDetail'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /admin/posts/{id}/publication:
    put:
      tags: [Operations]
      operationId: changeManagedPostPublication
      description: Requires the admin scope. Takes a published post offline or restores its previously approved version.
      x-requirements: [FR-CNT-07]
      parameters:
        - {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManagedStatusChange'}
      responses:
        '200': {$ref: '#/components/responses/ManagedPostDetail'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/audit-tasks:
    get:
      tags: [Audit]
      operationId: listAuditTasks
      x-requirements: [FR-AUD-01, FR-AIOPS-02]
      parameters:
        - name: state
          in: query
          schema: {$ref: '#/components/schemas/AuditState'}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Authorized audit queue
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditTaskPage'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/audit-tasks/{taskId}/decisions:
    post:
      tags: [Audit]
      operationId: decideAuditTask
