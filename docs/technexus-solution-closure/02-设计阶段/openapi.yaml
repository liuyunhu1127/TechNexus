    DemandWrite:
      type: object
      additionalProperties: false
      required: [title, description, visibility]
      properties:
        title: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, minLength: 1, maxLength: 50000}
        technicalRequirements: {type: array, items: {type: string, maxLength: 500}, maxItems: 30}
        budgetMin: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        budgetMax: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        deadlineAt: {oneOf: [{$ref: '#/components/schemas/Instant'}, {type: 'null'}]}
        visibility: {$ref: '#/components/schemas/Visibility'}
        contact: {type: string, maxLength: 1000, writeOnly: true}
        fileIds: {type: array, maxItems: 20, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
    DemandPatch:
      type: object
      additionalProperties: false
