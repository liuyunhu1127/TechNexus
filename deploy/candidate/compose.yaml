name: technexus

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  minio:
    image: debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc
    restart: unless-stopped
    env_file:
      - /etc/technexus/technexus.env
    environment:
      MINIO_API_CORS_ALLOW_ORIGIN: ${TECHNEXUS_ALLOWED_ORIGINS:?TECHNEXUS_ALLOWED_ORIGINS is required}
      HOME: /tmp
    command: ["/opt/technexus/minio", "server", "--address", ":9000", "--console-address", ":9001", "/data"]
    user: "65532:65532"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - ./bin/minio:/opt/technexus/minio:ro
      - /var/lib/technexus/minio:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    logging: *default-logging

  mysql:
    image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    restart: unless-stopped
    env_file:
      - /etc/technexus/technexus.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *default-logging

  clamav:
    image: clamav/clamav:1.5@sha256:7054e3f34308c384ea43cd786ea17abf899bd44af40af9f1b099853d7a5c214e
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\n' | nc -w 3 127.0.0.1 3310 | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    logging: *default-logging

  technexus-server:
    image: eclipse-temurin:21-jre-noble@sha256:0d57a8e90c2bb844c5a8e1b2b71e11eff06dad7edcfd803cd21ed4ae203b2515
    restart: unless-stopped
    env_file:
      - /etc/technexus/technexus.env
    command: ["java", "-XX:MaxRAMPercentage=70", "-jar", "/app/technexus-server.jar"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./app/technexus-server.jar:/app/technexus-server.jar:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /actuator/health/liveness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; grep -q '200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    logging: *default-logging

  technexus-web:
    image: node:22-bookworm-slim@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee
    restart: unless-stopped
    user: node
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    command: ["node", "/app/server/index.mjs"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./app/web:/app:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      technexus-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging: *default-logging

  technexus-admin:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:8080"
    volumes:
      - ./app/admin:/usr/share/nginx/html:ro
      - ./config/admin-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=8m
    depends_on:
      technexus-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *default-logging

volumes:
  mysql-data:
  clamav-data:
